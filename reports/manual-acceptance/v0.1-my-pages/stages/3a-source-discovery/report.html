<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>竞品页面报告</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17212b;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1280px;margin:auto;padding:40px 24px}header{border-bottom:1px solid #dce1e7;padding-bottom:22px;margin-bottom:28px}h1{font-size:30px;margin:0 0 8px}h2{font-size:21px;margin:0}.reason{color:#64707d;margin:4px 0 16px}section{margin:30px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),360px));justify-content:start;align-items:start;gap:16px}article{width:100%;max-width:360px;min-width:0;background:#fff;border:1px solid #e0e5eb;border-radius:8px;padding:12px}.meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}.meta span{font-size:12px;color:#64707d}.asset-image{display:block;width:auto;max-width:100%;height:auto;max-height:720px;object-fit:contain;margin:0 auto;background:#edf0f3;border-radius:4px;cursor:zoom-in}article p{color:#64707d;font-size:12px;overflow-wrap:anywhere}.label{display:inline-block;margin:8px 4px 0 0;padding:2px 6px;background:#edf3f7;border-radius:4px;font-size:12px}.unavailable,.fallback{padding:22px;background:#fff;border:1px solid #e0e5eb;border-radius:8px}dialog{border:0;border-radius:8px;padding:0;max-width:95vw;max-height:95vh;background:#111}dialog::backdrop{background:#000b}dialog img{max-width:92vw;max-height:90vh;display:block}button{position:absolute;right:10px;top:10px;border:0;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer}@media(max-width:600px){main{padding:24px 14px}.grid{grid-template-columns:minmax(0,1fr)}article{max-width:none}.asset-image{max-height:none}}</style></head><body><main><header><h1>我的页</h1><p>横向观察国内外直播、短视频、内容社区、电商、社交与长视频产品的“我的”页，比较个人身份信息、内容/创作管理、交易服务、会员权益与设置入口的组织方式。</p><p class="reason">分类维度： · 正式动态分类仅在 Stage 4 Agent Classification Plan 流程执行 · 有效样本：0</p></header><section class="unavailable"><h2>unavailable</h2><p>当前没有通过语义审核和机械质量校验的有效页面素材。</p></section></main><dialog id="viewer" onclick="if(event.target===this)this.close()"><button aria-label="关闭" onclick="this.closest('dialog').close()">×</button><img id="viewer-image" alt=""></dialog><script>function showModal(image){const viewer=document.getElementById('viewer');document.getElementById('viewer-image').src=image.src;document.getElementById('viewer-image').alt=image.alt;viewer.showModal()}</script></body></html>
