<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置页</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17212b;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1280px;margin:auto;padding:40px 24px}header{border-bottom:1px solid #dce1e7;padding-bottom:22px;margin-bottom:28px}h1{font-size:30px;margin:0 0 8px}h2{font-size:21px;line-height:1.3;margin:0;overflow-wrap:anywhere}.reason{color:#64707d;margin:4px 0 16px}section{margin:30px 0}.gallery-layout{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:36px 16px;align-items:start;margin:30px 0}.gallery-group{min-width:0;grid-column:span 5;margin:0;padding-top:14px;border-top:2px solid #dce1e7}.gallery-group[data-layout-size="1"]{grid-column:span 1}.gallery-group[data-layout-size="2"]{grid-column:span 2}.gallery-group[data-layout-size="3"]{grid-column:span 3}.gallery-group[data-layout-size="4"]{grid-column:span 4}.gallery-group[data-layout-size="5"]{grid-column:span 5}.gallery-group-header{min-width:0;margin-bottom:14px}.gallery-group-header .analysis-claim{margin:6px 0}.evidence-stats{padding:22px;background:#fff;border:1px solid #e0e5eb;border-radius:8px}.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.stat-grid>div{padding:12px;background:#f6f7f9;border-radius:6px}.stat-grid p{margin:4px 0 0;color:#64707d;font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));justify-content:start;align-items:start;gap:16px}.gallery-group[data-layout-size="1"] .grid{grid-template-columns:minmax(0,1fr)}.gallery-group[data-layout-size="2"] .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery-group[data-layout-size="3"] .grid{grid-template-columns:repeat(3,minmax(0,1fr))}.gallery-group[data-layout-size="4"] .grid{grid-template-columns:repeat(4,minmax(0,1fr))}.gallery-card{width:100%;min-width:0;background:#fff;border:1px solid #e0e5eb;border-radius:8px;padding:12px}.gallery-card[hidden]{display:none}.meta{min-width:0;margin-bottom:7px}.meta strong{display:block;overflow-wrap:anywhere}.card-badges{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}.status-chip{display:inline-block;padding:2px 6px;border-radius:999px;background:#edf3f7;color:#4d5c68;font-size:11px;line-height:1.45}.status-chip.critical{background:#f5efe2;color:#6b5427}.image-button{display:block;width:100%;min-height:40px;margin:0;padding:0;border:0;border-radius:4px;background:#edf0f3;cursor:zoom-in}.image-button:focus-visible,.more-button:focus-visible,summary:focus-visible,dialog>button:focus-visible{outline:3px solid #4d88a3;outline-offset:2px}.asset-image{display:block;width:auto;max-width:100%;height:auto;max-height:720px;object-fit:contain;margin:0 auto;background:#edf0f3;border-radius:4px}.gallery-card p{color:#64707d;font-size:12px;overflow-wrap:anywhere}.gallery-card .card-focus{margin:10px 0 4px}.gallery-card .card-focus .claim-statement{color:#394956;font-weight:600}.gallery-card .card-recommendation{margin:5px 0;color:#52616d}.card-details{border-top:1px solid #e7eaee;padding-top:9px}.card-details p,.card-details a{overflow-wrap:anywhere;word-break:break-word}.evidence-ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#64707d;font-size:11px}.label{display:inline-block;margin:8px 4px 0 0;padding:2px 6px;background:#edf3f7;border-radius:4px;font-size:12px}.unavailable,.fallback{padding:22px;background:#fff;border:1px solid #e0e5eb;border-radius:8px}.coverage-alert{padding:10px 12px;border-left:3px solid #a58136;background:#f7f2e8;color:#66542f;font-size:13px}.more-wrap{display:flex;justify-content:center;margin-top:16px}.more-button{border:1px solid #c7d0d9;border-radius:999px;background:#fff;color:#17212b;padding:8px 20px;font-size:14px;cursor:pointer}.more-button:hover{background:#edf3f7}dialog{border:0;border-radius:8px;padding:0;max-width:95vw;max-height:95vh;background:#111}dialog::backdrop{background:#000b}dialog img{max-width:92vw;max-height:90vh;display:block}dialog>button{position:absolute;right:10px;top:10px;border:0;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer}
@media(max-width:1100px){.gallery-layout{grid-template-columns:repeat(4,minmax(0,1fr))}.gallery-group[data-layout-size="5"]{grid-column:span 4}.gallery-group[data-layout-size="5"] .grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.gallery-layout{grid-template-columns:repeat(3,minmax(0,1fr))}.gallery-group[data-layout-size="4"],.gallery-group[data-layout-size="5"]{grid-column:span 3}.gallery-group[data-layout-size="4"] .grid,.gallery-group[data-layout-size="5"] .grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.gallery-layout{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery-group[data-layout-size="3"],.gallery-group[data-layout-size="4"],.gallery-group[data-layout-size="5"]{grid-column:span 2}.gallery-group[data-layout-size="3"] .grid,.gallery-group[data-layout-size="4"] .grid,.gallery-group[data-layout-size="5"] .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){main{padding:24px 14px}.gallery-layout{grid-template-columns:minmax(0,1fr);gap:30px}.gallery-group{grid-column:span 1!important}.gallery-group .grid{grid-template-columns:minmax(0,1fr)!important}.stat-grid{grid-template-columns:minmax(0,1fr)}.asset-image{max-height:none}}nav[data-module]{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}nav a{padding:6px 10px;border:1px solid #dce1e7;border-radius:4px}a{color:#235c75;overflow-wrap:anywhere}.analysis-claim{margin:12px 0;overflow-wrap:anywhere}.claim-statement{font-weight:600;margin:6px 0}.claim-evidence,.sample-count{font-size:12px;color:#64707d}.key-findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}.report-notice,.information-gap{font-size:13px;color:#65562d}details{margin:16px 0}summary{cursor:pointer;font-weight:600}.current-image-button{display:block;max-width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}.current-image-button:focus-visible{outline:3px solid #4d88a3;outline-offset:2px}.current-image{display:block;max-width:100%;width:auto;height:auto;max-height:560px;object-fit:contain}figure{margin:16px 0}details[data-module]{padding:16px;border:1px solid #dce1e7;border-radius:6px}.gallery-card .analysis-claim p{font-size:13px}h3{font-size:17px}section,article,details{scroll-margin-top:16px}</style></head><body><main><header data-module="overview"><h1>设置页</h1><p class="report-notice">未提供结构化分析；保留已有截图与证据，未按新版分析标准验收。</p><p class="sample-count">0 个竞品 · 0 张竞品截图</p></header><section class="unavailable"><h2>unavailable</h2><p>当前没有通过语义审核和机械质量校验的有效页面素材。</p></section><details data-module="methodology"><summary>来源与筛选说明</summary><h3>原始研究目标</h3><p>验证通用任务、分类、分析与报告入口</p></details></main><dialog id="viewer" onclick="if(event.target===this)this.close()"><button aria-label="关闭" onclick="this.closest('dialog').close()">×</button><img id="viewer-image" alt=""></dialog><script>function showModal(image){const viewer=document.getElementById('viewer');document.getElementById('viewer-image').src=image.src;document.getElementById('viewer-image').alt=image.alt;viewer.showModal()}
const PAGE_SIZE=20;
function initGalleries(){document.querySelectorAll('[data-gallery]').forEach(gallery=>{const cards=[...gallery.querySelectorAll('.gallery-card')];const button=document.querySelector(`[data-more-for="${gallery.id}"]`);let visible=Math.min(PAGE_SIZE,cards.length);const apply=()=>{cards.forEach((card,index)=>{card.hidden=index>=visible});if(button)button.hidden=visible>=cards.length};apply();if(button)button.addEventListener('click',()=>{visible=Math.min(visible+PAGE_SIZE,cards.length);apply()})})}
document.addEventListener('DOMContentLoaded',initGalleries);
document.addEventListener('click',event=>{const link=event.target.closest('[data-evidence-target]');if(!link)return;const target=document.getElementById(link.dataset.evidenceTarget);if(!target)return;const gallery=target.closest('[data-gallery]');if(gallery){const button=document.querySelector(`[data-more-for="${gallery.id}"]`);while(target.hidden&&button&&!button.hidden)button.click()}let parent=target;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement}});</script></body></html>
